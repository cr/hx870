[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hxtool"
version = "0.4.0"
description = "Tool for Yaesu / Standard Horizon HX series radio flashing and configuration"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Christiane Ruetten", email = "cr@23bit.net" },
]
keywords = [
    "hamradio", "radio", "maritime", "yaesu", "standard horizon", "hx870", "hx870e",
    "hx890", "hx890e", "firmware", "flashing", "mmsi", "atis",
]
classifiers = [
    "Environment :: Console",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Customer Service",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "gpxpy",
    "ipython",
    "pyserial",
    "rich",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/cr/hx870"
Download = "https://github.com/cr/hx870/archive/master.tar.gz"

[project.scripts]
hxtool = "hxtool.main:main"

[tool.setuptools.packages.find]
include = ["hxtool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow",
    "hardware: talks to real radios; the default fixture hides them",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, and pyupgrade (modern syntax for the target version)
select = ["E", "W", "F", "UP"]
