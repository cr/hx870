name: Tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The simulator tests skip themselves on Windows. The Windows job
        # still proves that hxtool installs, imports and starts there.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install hxtool with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check that the command line tool starts
        run: hxtool --version

      - name: Lint
        run: python -m ruff check hxtool tests tools

      - name: Run the test suite
        run: python -m pytest -v
